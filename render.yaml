databases:
  - name: careconnect-db
    plan: free
    region: singapore

services:
  - type: web
    name: careconnect-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: careconnect-agent
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python voice_agent.py --host 0.0.0.0 --port $PORT --transport webrtc
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: careconnect-db
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: 21m00Tcm4TlvDq8ikWAM
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PIPECAT_ALLOWED_ORIGINS
        sync: false
      - key: PIPECAT_ICE_SERVERS
        value: stun:stun.l.google.com:19302
